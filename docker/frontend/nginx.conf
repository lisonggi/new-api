# nginx configuration for the split frontend image.
# Included at http level by nginx:1.27-alpine (conf.d/default.conf), so the
# map directive below is valid here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Match the upstream gateway limits; base64 image payloads get large.
    client_max_body_size 64m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    # Resolve the backend service per request so nginx starts even if the
    # backend container is not up yet (Docker embedded DNS).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed, immutable build assets (rsbuild emits /static/js/*.hash.js,
    # /static/css/*.hash.css).
    location ^~ /static/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Management API, OpenAI/Gemini relay, legacy billing, playground and
    # Midjourney relay go to the backend. WebSockets (relay ws, console) and
    # SSE streaming require HTTP/1.1, upgrade headers and no buffering.
    location ~ ^/(api|v1|v1beta|dashboard|pg|mj)(/|$) {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Midjourney :mode variant (/<mode>/mj/...), e.g. /fast/mj/submit.
    location ~ ^/[^/]+/mj(/|$) {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA static files with history-mode fallback.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
