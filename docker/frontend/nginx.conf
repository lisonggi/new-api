# nginx configuration for the split frontend image.
# Included at http level by nginx:1.27-alpine (conf.d/default.conf), so the
# map directive below is valid here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Only Caddy can reach this unpublished service from outside Docker. Preserve
# its normalized HTTPS indication instead of replacing it with internal HTTP.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    # Match the origin cap in docker/prod/Caddyfile (10MB); base64 image
    # payloads inflate ~1/3, so 10MB of body is ~7.5MB of raw image.
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    # Resolve the backend service per request so nginx starts even if the
    # backend container is not up yet (Docker embedded DNS).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed, immutable build assets (rsbuild emits /static/js/*.hash.js,
    # /static/css/*.hash.css).
    location ^~ /static/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Management API, OpenAI/Gemini relay, legacy billing, playground and
    # Midjourney relay go to the backend. WebSockets (relay ws, console) and
    # SSE streaming require HTTP/1.1, upgrade headers and no buffering.
    # NOTE: only /dashboard/billing/* is a real backend API; the rest of
    # /dashboard/* (overview, models, channel, ...) are SPA routes and must
    # fall through to the history-mode index.html below; the split backend
    # otherwise returns its empty HTML placeholder.
    location ~ ^/(api|v1|v1beta|dashboard/billing|pg|mj)(/|$) {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Midjourney :mode variant (/<mode>/mj/...), e.g. /fast/mj/submit.
    location ~ ^/[^/]+/mj(/|$) {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA static files with history-mode fallback.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
