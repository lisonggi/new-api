<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Deployment branding is fixed at build time. Set the tab title before
         the app bundle loads so it never flashes the static default. -->
    <script>
      document.title = 'iioooo'
      var metaTitle = document.querySelector('meta[name="title"]')
      if (metaTitle) metaTitle.setAttribute('content', 'iioooo')
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
