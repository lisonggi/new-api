# Production split deployment with automatic HTTPS (Caddy) for a public domain.
#
# Secrets come from ./.env (NOT committed):
#   POSTGRES_PASSWORD=<random>
#   SESSION_SECRET=<long random>
#   POSTGRES_USER=iioooo
#   POSTGRES_DB=iioooo
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Only Caddy publishes ports (80/443). The frontend/backend/postgres/redis stay
# on the compose network, so the host attack surface is 22 (key-only) + 80/443.
# Redis is the shared cache (REDIS_CONN_STRING): token/channel caches plus
# atomic quota counters; appendonly keeps the counters across restarts.
name: iioooo-hk

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

  frontend:
    image: ghcr.io/lisonggi/new-api-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    image: ghcr.io/lisonggi/new-api-backend:latest
    restart: unless-stopped
    environment:
      - SQL_DSN=postgres://${POSTGRES_USER:-iioooo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-iioooo}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - REDIS_CONN_STRING=redis://redis:6379/0
      - GIN_MODE=release
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
      - CHANNEL_UPDATE_FREQUENCY=10
      - UPSTREAM_ERROR_HIDE=all
      - UPSTREAM_ERROR_MESSAGE=上游服务暂时不可用，请稍后重试
      - CRITICAL_RATE_LIMIT=300
      - CRITICAL_RATE_LIMIT_DURATION=60
    volumes:
      - backend-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-iioooo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-iioooo}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iioooo}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  backend-data:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
